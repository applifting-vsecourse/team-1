name: Build & Deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}
# Pushes to the course registry and Coolify with their own secrets; the GitHub token only reads.
permissions:
  contents: read
env:
  COURSE_DOMAIN: vsepractical.applifting.dev
  REGISTRY: registry.vsepractical.applifting.dev
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Determine slug
        id: slug
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          if [ "$REPO_NAME" = "edu-template" ]; then SLUG="$OWNER"; else SLUG="${REPO_NAME,,}"; fi
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "url=https://$SLUG.$COURSE_DOMAIN" >> "$GITHUB_OUTPUT"
      - name: Login to registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: registry.vsepractical.applifting.dev
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build & push backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/backend/Dockerfile.deploy
          push: true
          build-args: |
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          tags: ${{ env.REGISTRY }}/${{ steps.slug.outputs.slug }}-backend:latest
      - name: Build & push frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/frontend/Dockerfile.deploy
          push: true
          build-args: |
            VITE_API_URL=${{ steps.slug.outputs.url }}/api
            VITE_BETTER_AUTH_URL=${{ steps.slug.outputs.url }}
          tags: ${{ env.REGISTRY }}/${{ steps.slug.outputs.slug }}-frontend:latest
      - name: Trigger Coolify deploy
        if: env.COOLIFY_WEBHOOK != ''
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"
