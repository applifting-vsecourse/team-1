name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Integration tests (pnpm backend test:int) need a real Postgres. Same
    # port and credentials as the local docker-compose, so the .env created
    # from .env.example works unchanged; the tests create `togena_test` themselves.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: togena
          POSTGRES_PASSWORD: togena
          POSTGRES_DB: togena
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U togena -d togena"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create env files
        run: pnpm env:check

      - name: Generate Prisma client
        run: pnpm backend prisma:generate

      - name: Format check
        run: pnpm format:check

      - name: Test scripts
        run: pnpm test:scripts

      - name: Lint backend
        run: pnpm backend lint:check

      - name: Lint frontend
        run: pnpm frontend lint:check

      - name: Type-check frontend
        run: pnpm frontend type-check

      - name: Test backend
        run: pnpm backend test

      - name: Integration tests backend
        run: pnpm backend test:int

      - name: Test frontend
        run: pnpm frontend test:ci

      - name: Build backend
        run: pnpm backend build

      - name: Build frontend
        run: pnpm frontend build

  # E2E (Playwright, docs/E2E.md): the core journeys in a real browser against a
  # built backend + frontend and a freshly seeded `togena_e2e` database.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: togena
          POSTGRES_PASSWORD: togena
          POSTGRES_DB: togena
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U togena -d togena"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create env files
        run: pnpm env:check

      - name: Install Chromium for Playwright
        run: pnpm e2e exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm e2e test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
