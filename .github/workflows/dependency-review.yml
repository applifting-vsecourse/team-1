name: Dependency review

# Fails a PR that adds or upgrades to a dependency with a known high or critical
# advisory (SECURITY.md). It checks only what the PR changes, so the vulnerabilities
# already on main (docs/SECURITY-REPORT.md) don't block unrelated PRs.
# Needs the dependency graph on in the repository settings.

on:
  pull_request:
    paths:
      - "**/package.json"
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - "**/Dockerfile*"
      - "**/docker-compose.yml"
      - .github/workflows/**

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
