name: AI review (Raspberry Pi)

# Scheduled low-budget review on the team's self-hosted Raspberry Pi runner.
# Prepared, not live yet: it only runs once the repository variable
# AI_REVIEW_ENABLED is 'true' and a runner with the `pi` label is registered
# (setup in CONTRIBUTING.md, section "AI review"). Until then every run is skipped.
#
# Same agent and output format as the pre-push hook (.claude/agents/reviewer.md),
# but on haiku with a hard per-run budget; the result goes to the PR as a comment.

on:
  schedule:
    - cron: '0 5 * * 1-5' # weekdays 07:00 Prague (CEST)
  workflow_dispatch:
    inputs:
      pr:
        description: PR number (empty = all open PRs updated in the last day)
        required: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review
  cancel-in-progress: false

jobs:
  review:
    if: vars.AI_REVIEW_ENABLED == 'true'
    runs-on: [self-hosted, pi]
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      AI_REVIEW_MODEL: haiku
      AI_REVIEW_BUDGET: ${{ vars.AI_REVIEW_BUDGET || '0.10' }}
      AI_REVIEW_MAX_BYTES: '60000'
      AI_REVIEW_SETTING_SOURCES: user
      MAX_PRS: ${{ vars.AI_REVIEW_MAX_PRS || '5' }}
      INPUT_PR: ${{ inputs.pr }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Review open PRs
        run: |
          # Script and agent always come from main, so a PR can't rewrite its own
          # reviewer. The agent goes to user scope because project settings
          # (.claude/ from the PR, which may define hooks) are not loaded here.
          cp scripts/ai-review.sh "$RUNNER_TEMP/ai-review.sh"
          mkdir -p "$HOME/.claude/agents"
          cp .claude/agents/reviewer.md "$HOME/.claude/agents/reviewer.md"

          if [ -n "$INPUT_PR" ]; then
            [[ "$INPUT_PR" =~ ^[0-9]+$ ]] || { echo "PR must be a number"; exit 1; }
            prs="$INPUT_PR"
          else
            since="$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)"
            prs="$(gh pr list --state open --draft=false --limit "$MAX_PRS" \
              --json number,updatedAt --jq ".[] | select(.updatedAt > \"$since\") | .number")"
          fi

          for pr in $prs; do
            echo "::group::PR #$pr"
            gh pr checkout "$pr" --force
            # The script skips itself when CI is set; the runner is the one place we want it.
            log="$(git rev-parse --git-dir)/ai-review-last.txt"
            rm -f "$log"
            CI= bash "$RUNNER_TEMP/ai-review.sh" origin/main || true
            # No log = nothing reviewed (empty diff, no merge base); don't comment.
            if [ ! -s "$log" ]; then echo "::endgroup::"; continue; fi
            body="$(cat "$log")"
            gh pr comment "$pr" --body "$(printf '**AI review** (%s, %s)\n\n```\n%s\n```' \
              "$AI_REVIEW_MODEL" "$(git rev-parse --short HEAD)" "$body")"
            echo "::endgroup::"
          done
