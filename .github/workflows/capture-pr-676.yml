name: Publish approved PR 676 screenshots
on:
  push:
    branches: [tmp/pr-676-capture-c6ae847-1122]
permissions: {}
jobs:
  publish:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'Publish the 14 approved PR 676 screenshots'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: pr-screenshots
          sparse-checkout: '676'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45051941580
          artifact-ids: 14765877780,14765459514
          merge-multiple: true
          path: ${{ runner.temp }}/pr-676
      - name: Check PNG names, signatures and dimensions
        run: |
          python3 - <<'PY'
          import os, shutil, struct
          from pathlib import Path
          data = Path(os.environ['RUNNER_TEMP']) / 'pr-676'
          output = Path('676')
          expected = {
              f'{state}-{width}-{revision}-{sha}-20261122.png': width
              for revision, sha in [('before', 'fc4caae'), ('after', 'c6ae847')]
              for state in ['bulk', 'empty', 'reset', 'filters']
              for width in ([360] if state == 'filters' else [360, 1280])
          }
          assert {p.name for p in data.iterdir()} == set(expected)
          for name, width in expected.items():
              source = data / name
              assert source.is_file() and not source.is_symlink()
              raw = source.read_bytes()
              assert raw[:8] == bytes.fromhex('89504e470d0a1a0a')
              assert raw[12:16] == b'IHDR'
              w, h = struct.unpack('>II', raw[16:24])
              assert w == width and h >= 800, (name, w, h)
              assert not (output / name).exists()
              shutil.copyfile(source, output / name)
          PY
      - name: Publish only the checked screenshots
        run: |
          git add -- 676/
          test "$(git diff --cached --name-only | wc -l)" -eq 14
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh 14 application queue screenshots for #676'
          for attempt in 1 2 3; do
            git pull --rebase origin pr-screenshots
            if git push origin HEAD:pr-screenshots; then exit 0; fi
          done
          exit 1
