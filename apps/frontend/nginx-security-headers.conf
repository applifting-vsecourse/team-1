# Security headers of the frontend (#293), included by nginx.conf. nginx drops
# every inherited add_header in a location that has its own, so each such
# location includes this file again.
#
# CSP: the app is one bundle from this origin. It calls the API at
# VITE_API_URL: the same origin on staging, another port in docker-compose.yml,
# so Dockerfile.deploy replaces __API_ORIGIN__ with that origin at build time.
# Inline styles stay allowed: Radix and the toasts set them at runtime.
# blob:/data: images are the photo preview.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' __API_ORIGIN__ data: blob:; font-src 'self' data:; connect-src 'self' __API_ORIGIN__; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
