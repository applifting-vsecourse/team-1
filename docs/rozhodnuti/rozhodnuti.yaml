- id: D-044
  nazev: Nálezy z testování (#153)
  text: '**Nálezy z testování (#153).** Smazat jde jen akci bez přihlášek (`DELETE /api/organizer/events/:eventId`,
    jinak 409 `EVENT_HAS_APPLICATIONS`); smaže i termíny a pokoje. Archivace akce s přihláškami je mimo
    rozsah. Filtr úhrady v seznamu přihlášek má stavy Nezaplaceno / Částečně zaplaceno / Zaplaceno / Přeplatek
    (`?payment=`). U přihlášky bez částky k úhradě (jen náhradník) se platba nezapisuje; u zaplacené je
    „Zapsat platbu“ jen vedlejší akce. Po odeslání za více účastníků je nahoře součet k úhradě, platby
    zůstávají po účastnících (vlastní VS).'
