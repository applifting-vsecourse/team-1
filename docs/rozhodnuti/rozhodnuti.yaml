- id: D-042
  nazev: Dashboard organizátora se ruší
  text: '**Dashboard organizátora se ruší.** Po přihlášení organizátor přistane na seznamu akcí (`/organizer`
    přesměruje na `/organizer/events`), sidebar má jen „Akce“ a „Organizace“. Panel „Co vyžaduje pozornost“
    přijde nad seznam akcí, až budou data z US-29 / US-52. Účet (avatar, jméno, e-mail) je dole v sidebaru
    a v mobilním draweru, menu se otevírá nahoru (Nastavení účtu, Odhlásit se). Horní lišta má roli, jazyk
    a vzhled; na mobilu menu, logo, jazyk a vzhled. Sekce akce jsou na mobilu rozbalovací menu s aktuální
    sekcí („Přehled · 1 z 5“) místo posuvných záložek. Návrh N1–N9, Figma stránka „HF / 07 Návrh 25. 10.“.
    **Zrušení dashboardu bylo změněno rozhodnutím 2026-10-28** (dashboard se vrací).'
