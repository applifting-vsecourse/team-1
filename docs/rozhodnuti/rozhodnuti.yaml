- id: D-045
  nazev: Duplicitní přihláška (#160, US-23)
  text: '**Duplicitní přihláška (#160, US-23).** Odeslání odmítne (409 `APPLICATION_DUPLICATE`, nic se
    neuloží), když stejný účastník už je přihlášený na některý z vybraných termínů téže akce, i v téže
    přihlášce nebo s jiným e-mailem. Účastník je stejný při shodném jménu a příjmení bez ohledu na velikost
    písmen, diakritiku a nadbytečné mezery („Jan Novák“ = „jan NOVAK“) a při shodném datu narození. Jiný
    termín stejné akce duplicita není. Kontrola běží v transakci pod zámkem akce, takže drží i při souběhu.
    Aby odmítnuté odeslání nezanechalo ani účet přihlašovatele, zpracovávají se odeslání jedné akce po
    jednom v procesu backendu (`KeyedMutex` v `ApplicationsService.submit`); **omezení:** to platí jen
    pro jednu instanci backendu (staging i produkce zatím běží v jedné). Při více instancích by bylo potřeba
    zámek v databázi, jinak může při souběhu zůstat účet bez přihlášky. Chyba nese `params` (`participant`,
    `term`) pro přeloženou hlášku.'
  typ: produkt
  oblast: přihlašování na akce
  datum: '2026-10-26'
