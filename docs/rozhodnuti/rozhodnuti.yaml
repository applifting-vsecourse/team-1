  text: '**Souhrnný potvrzovací e-mail.** Přihlašovatel dostane JEDEN e-mail za celé odeslání formuláře,
    i když přihlásil víc účastníků (minimum e-mailů). V něm je u každého účastníka stav termínů a u každé
