title: Přihláška v termínu (životní cyklus, ruční vyhodnocování)
diagram: lifecycle

# odvozeno z procesu zpracování přihlášky v termínu (zpracovani-prihlasky.yaml)

states:
  - { id: k_vyhodnoceni, label: K vyhodnocení }
  - { id: nahradnik, label: Náhradník }
  - { id: potvrzena_dluh, label: Potvrzená s dluhem }
  - { id: potvrzena_zaplacena, label: Potvrzená a zaplacená }
  - { id: zrusena, label: Zrušená, final: true }
  - { id: archivovana, label: Archivovaná, final: true }

transitions:
  - { from: start, to: k_vyhodnoceni, reason: Nová přihláška v termínu přijata, op: register() }
  # přidání termínu k existující přihlášce a ruční přidání přihlášky: start → stav, podle toho, kdo mění (D-134, D-153)
  # ručně přidaná přihláška přeskočí K vyhodnocení
  - {
      from: start,
      to: potvrzena_dluh,
      reason: Organizátor přihlášku přidá ručně a určí stav termínu,
      op: registerByOrganizer(),
    }
  - {
      from: start,
      to: nahradnik,
      reason: Organizátor přihlášku přidá ručně a určí stav termínu,
      op: registerByOrganizer(),
    }
  - { from: start, to: potvrzena_dluh, reason: Organizátor přidá termín, op: addTerm() }
  - {
      from: start,
      to: k_vyhodnoceni,
      reason: Přihlašovatel přidá termín před datem schvalování,
      op: addTerm(),
    }
  # Odhláška a změna termínu od data schvalování jde přes žádost (zadost-o-zmenu.yaml, D-134, D-140); stavové přechody se tím nemění, žádost je samostatný objekt.

  - {
      from: k_vyhodnoceni,
      to: potvrzena_dluh,
      reason: "Organizátor vyhodnotí přihlášku v termínu: potvrdí",
      op: confirm(),
    }
  - {
      from: k_vyhodnoceni,
      to: nahradnik,
      reason: "Organizátor vyhodnotí přihlášku v termínu: zařadí jako náhradníka",
      op: putOnWaitlist(),
    }
  - {
      from: k_vyhodnoceni,
      to: zrusena,
      reason: "Organizátor vyhodnotí přihlášku v termínu: zamítne",
      op: cancel(),
    }

  - {
      from: nahradnik,
      to: potvrzena_dluh,
      reason: Uvolní se místo a organizátor ručně potvrdí (návrh náhradníka dostane organizátor jako banner). Potvrzení v okně „začátek termínu minus lhůta“ je rovnou po splatnosti (D-099),
      op: confirm(),
    }

  - {
      from: nahradnik,
      to: zrusena,
      reason: Nastala půlnoc (Europe/Prague) prvního dne termínu akce,
      op: cancel(),
    }
  - { from: nahradnik, to: zrusena, reason: Organizátor zruší náhradníka, op: cancel() }
  - {
      from: nahradnik,
      to: zrusena,
      reason: Účastník se odhlásí (nebo odhlášku zadá organizátor),
      op: cancel(),
    }

  - {
      from: potvrzena_dluh,
      to: nahradnik,
      reason: Organizátor přesune přihlášku mezi náhradníky,
      op: putOnWaitlist(),
    }
  - {
      from: potvrzena_dluh,
      to: potvrzena_dluh,
      reason: Lhůta pro zaplacení dluhu uplynula,
      op: sendPaymentRequest(),
    }
  - {
      from: potvrzena_dluh,
      to: zrusena,
      reason: Účastník se odhlásí (nebo odhlášku zadá organizátor),
      op: cancel(),
    }
  - {
      from: potvrzena_dluh,
      to: potvrzena_zaplacena,
      reason: Σ plateb = částka k úhradě,
      op: recordPayment(),
    }
  - {
      from: potvrzena_dluh,
      to: zrusena,
      reason: Nastaly okolnosti pro zamítnutí přihlášky v termínu,
      op: cancel(),
    }

  - {
      from: potvrzena_zaplacena,
      to: zrusena,
      reason: Nastaly okolnosti pro zamítnutí přihlášky v termínu,
      op: cancel(),
    }
  - {
      from: potvrzena_zaplacena,
      to: zrusena,
      reason: Účastník se odhlásí (nebo odhlášku zadá organizátor),
      op: cancel(),
    }
  - {
      from: potvrzena_zaplacena,
      to: archivovana,
      reason: První den po posledním dni termínu přihlášky v termínu,
      op: archive(),
    }
  - {
      from: potvrzena_zaplacena,
      to: potvrzena_dluh,
      reason: "Organizátor opraví nebo odstraní platbu a vznikne dluh (lhůta pro zaplacení běží znovu, D-101)",
      op: correctPayment(),
    }

  # zrušení termínu akce (proces zruseni-terminu.yaml, D-065): zruší přihlášky ve všech stavech kromě archivované
  - { from: nahradnik, to: zrusena, reason: Organizátor zruší termín akce, op: cancel() }
  - { from: potvrzena_dluh, to: zrusena, reason: Organizátor zruší termín akce, op: cancel() }
  - { from: potvrzena_zaplacena, to: zrusena, reason: Organizátor zruší termín akce, op: cancel() }
  - { from: k_vyhodnoceni, to: zrusena, reason: Organizátor zruší termín akce, op: cancel() }

  - { from: zrusena, to: end }
  - { from: archivovana, to: end }
