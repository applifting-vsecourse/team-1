- id: Q-PRI-07
  otazka: Má změna termínu nebo odhláška proběhnout hned, nebo ji organizátor nejdřív schválí (kvůli kapacitě
    a storno podmínkám)?
  epic: přihlašování na akce
  us:
  - label: US-84
    url: https://github.com/applifting-vsecourse/team-1/issues/84
  stav: otevreno
  priorita: P1
  priorita_duvod: Účastník si sám mění termín a odhlašuje se (návrh PO); chybí pravidlo hned / po schválení.
  ceka_na: po
  zdroje:
  - popis: issue
    url: https://github.com/applifting-vsecourse/team-1/issues/84
    citace: „**Otevřená otázka na PO:** F-20 – má změna termínu nebo odhláška proběhnout hned, nebo ji
      organizátor nejdřív schválí (kvůli kapacitě a storno podmínkám)?“
  poznamka: 'Návrh PO z 28. 10. říká: účastník si sám opraví údaje, změní termín nebo se odhlásí; když
    už běží storno podmínky, schvaluje organizátor. Nerozhoduje, co je „hned“ a co „po schválení“ před
    začátkem storno podmínek.'
